name: Deploy

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'image to push'
        required: true
        type: choice
        options:
          - vireo
          - vireo-dev
        default: 'vireo-dev'
      environment:
        description: 'stage or prod'
        required: true
        type: environment
        default: 'stage'

env:
  VIREO_HOSTNAME: ${{ vars.VIREO_HOSTNAME }}

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v4

      - name: executing rsync as jhu-devops using secret
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: /
          remote_path: /home/jhu-devops/vireo
          remote_host: ${{ env.VIREO_HOSTNAME }}.mse.jhu.edu
          remote_user: jhu-devops
          remote_key: ${{ secrets.JHU_DEVOPS_KEY }}

      - name: executing remote ssh commands as jhu-devops using secret
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VIREO_HOSTNAME }}.mse.jhu.edu
          username: jhu-devops
          key: ${{ secrets.JHU_DEVOPS_KEY }}
          script: | 
            docker pull ghcr.io/jhu-sheridan-libraries/${{ inputs.images }}:4.2.10
            # docker run -d -p 9000:9000 ghcr.io/jhu-sheridan-libraries/${{ inputs.images }}:4.2.10 
            wget https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem
            mv ./us-east-1-bundle.pem /etc/pki/ca-trust/source/whitelist/
            update-ca-trust
            cd ./vireo
            cp ./example.env .env
            docker compose up --detach