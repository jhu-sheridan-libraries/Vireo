name: Deploy to VM

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'image to push'
        required: true
        type: choice
        options:
          - vireo
          - vireo-dev
        default: 'vireo-dev'
      environment:
        description: 'stage(02) or prod(03)'
        required: true
        type: environment
        default: 'stage'

jobs:
  deploy:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: executing rsync as jhu-devops using secret
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: /
          remote_path: /opt/vireo/Vireo
          remote_host: ${{ secrets.VIREO_HOSTNAME }}
          remote_user: jhu-devops
          remote_key: ${{ secrets.JHU_DEVOPS_KEY }}

      - name: executing remote ssh commands as jhu-devops using secret
        uses: appleboy/ssh-action@v1
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD}}
          # PGPASSWORD: vireo
          SPRING_DATASOURCE_URL: jdbc:postgresql://${{ secrets.DB_HOSTNAME }}:5432/vireo4
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD}}

        with:
          host: ${{ secrets.VIREO_HOSTNAME }}
          username: jhu-devops
          key: ${{ secrets.JHU_DEVOPS_KEY }}
          envs: PGPASSWORD, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD
          script: |
            cd /opt/vireo/Vireo
            docker compose down
            cp ../.env .env
            cp ../application.yml ./src/main/resources/application.yml
            chown -R vireo:vireo /opt/vireo/Vireo
            docker pull ghcr.io/jhu-sheridan-libraries/${{ inputs.images }}:4.2.10
            #docker compose up --detach
            # wget https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem
            # sudo mv ./us-east-1-bundle.pem /etc/pki/ca-trust/source/
            # sudo update-ca-trust