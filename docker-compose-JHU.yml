networks:
  net:

#volumes:
#  pgdata:

services:

  vireo:
    container_name: vireo
    hostname: vireo
    image: ${IMAGE_HOST}/${SERVICE_PROJECT}/${SERVICE_PATH}:${IMAGE_VERSION}
    build:
      dockerfile: Dockerfile
      context: './'
    env_file:
       - .env
    environment:
      # Spring Boot override variables (values from .env via env_file above)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATASOURCE_DRIVERCLASSNAME=${SPRING_DATASOURCE_DRIVERCLASSNAME}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - AUTH_SECURITY_JWT_SECRET=${AUTH_SECURITY_JWT_SECRET}
      - AUTH_SECURITY_JWT_ISSUER=${AUTH_SECURITY_JWT_ISSUER}
      - AUTH_SECURITY_JWT_DURATION=${AUTH_SECURITY_JWT_DURATION}
      - APP_SECURITY_SECRET=${APP_SECURITY_SECRET}
      - APP_EMAIL_HOST=${APP_EMAIL_HOST}
      - APP_EMAIL_FROM=${APP_EMAIL_FROM}
      - LOGGING_LEVEL_ORG_TDL=${LOGGING_LEVEL_ORG_TDL}
    volumes:
      - /opt/vireo:${APP_PATH}
    ports:
      - 9000:9001
    depends_on:
      - httpd
    networks:
      - net

  httpd:
    image: httpd:2.4-alpine
    # command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/vireo/httpd:/etc/httpd/conf.d
      - /opt/vireo/certbot/conf:/etc/letsencrypt
      - /opt/vireo/www:/var/www/certbot
    networks:
      - net

