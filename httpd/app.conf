<VirtualHost *:80>
    ServerName msel-vireo03.mse.jhu.edu

    ProxyRequests Off

    <Location />
        # These directives handle the actual proxying of requests.
        ProxyPass http://msel-vireo03.mse.jhu.edu:9000/
        ProxyPassReverse http://msel-vireo03.mse.jhu.edu:9000/

        # Now, let's set the headers to match what your Nginx config was doing.
        # Nginx: proxy_set_header Host $server_name;
        RequestHeader set Host "msel-vireo03.mse.jhu.edu"

        # Nginx: proxy_set_header X-Real-IP $remote_addr;
        RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}

        # Nginx: proxy_set_header X-Forwarded-Proto $scheme; (Nginx's $scheme would be "http" here)
        RequestHeader set X-Forwarded-Proto "http"

        # Nginx: proxy_set_header X-Forwarded-Host $host;
        RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}

        # Nginx: proxy_set_header X-Forwarded-Port $server_port; (Nginx's $server_port would be 80 here)
        RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}
    </Location>
</VirtualHost>